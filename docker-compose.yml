version: '3.8'

services:
  # MySQL 8 Database Service
  mysql-db:
    image: mysql:8.0
    container_name: pragati-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pragati_nursery}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER:-pragati_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend Service
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: pragati-backend
    restart: always
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      PORT: ${PORT:-8080}
      DB_URL: ${DB_URL:-jdbc:mysql://mysql-db:3306/pragati_nursery?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
      DB_USERNAME: ${DB_USERNAME:-pragati_user}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-900000}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-604800000}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      UPLOAD_DIRECTORY: ${UPLOAD_DIRECTORY:-./backend-uploads}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/backend-uploads

volumes:
  mysql_data:
  backend_uploads:
